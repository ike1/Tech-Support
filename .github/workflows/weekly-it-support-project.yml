name: Weekly IT support project

on:
  # GitHub Actions uses UTC. 04:00 UTC is 12:00 Saturday in Singapore (UTC+8).
  schedule:
    - cron: "0 4 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create this week's project
        run: python scripts/Weekly_IT_support_project.py

      - name: Commit and push the project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then
            echo "A project for this date already exists; nothing to commit."
            exit 0
          fi
          git commit -m "chore: add weekly IT support project"
          git push
